<svg width="1000" height="227" viewBox="0 0 1000 227" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- "Think inside" -->
  <text x="500" y="88" text-anchor="middle" font-family="'Fredoka', 'Plus Jakarta Sans', Arial, sans-serif" font-size="82" font-weight="900" fill="#180c2e" letter-spacing="1.5">Think inside</text>

  <!-- Black badge container for "the box." -->
  <g transform="translate(240, 115)">
    <rect x="0" y="0" width="520" height="96" rx="14" fill="#180c2e" filter="url(#boxShadow)"/>
    
    <!-- Text "the b" -->
    <text x="45" y="68" font-family="'Fredoka', 'Plus Jakarta Sans', Arial, sans-serif" font-size="68" font-weight="900" fill="#ffffff" letter-spacing="1">the b</text>
    
    <!-- Golden Paw inside the "o" -->
    <g transform="translate(232, 22) scale(1.05)">
      <ellipse cx="24" cy="38" rx="14" ry="11" fill="#f59e0b"/>
      <ellipse cx="10" cy="22" rx="5" ry="7.5" transform="rotate(-15 10 22)" fill="#ffd166"/>
      <ellipse cx="20" cy="15" rx="5" ry="8" transform="rotate(-5 20 15)" fill="#ffd166"/>
      <ellipse cx="31" cy="15" rx="5" ry="8" transform="rotate(5 31 15)" fill="#ffd166"/>
      <ellipse cx="40" cy="23" rx="5" ry="7.5" transform="rotate(18 40 23)" fill="#ffd166"/>
    </g>
    
    <!-- Text "x." -->
    <text x="305" y="68" font-family="'Fredoka', 'Plus Jakarta Sans', Arial, sans-serif" font-size="68" font-weight="900" fill="#ffffff" letter-spacing="1">x.</text>
    
    <!-- Subtitle badge: Furry Friends -->
    <rect x="365" y="24" width="135" height="50" rx="8" fill="#e67e22"/>
    <text x="432" y="46" text-anchor="middle" font-family="'Fredoka', sans-serif" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="1">FURRY</text>
    <text x="432" y="62" text-anchor="middle" font-family="'Fredoka', sans-serif" font-size="12" font-weight="800" fill="#ffd166" letter-spacing="1">FRIENDS</text>
  </g>
</svg>